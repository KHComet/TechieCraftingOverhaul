# ============================================================================
# Techie Crafting Overhaul - base weapon map for perk 20 (all vanilla iconics)
#
# Defines the "base weapon" consumed when replicating an iconic. Resolution order:
#   1. the weapon listed in this table (TCO.BaseMap.<iconic record>) - takes priority
#   2. automatic: a normal *_Default preset with the same weapon type (itemType) and friendlyName
#
# Format: key = "TCO.BaseMap." + iconic record ID, craftableItem = list of base weapons (one or more)
#         listing the same weapon twice requires two of them.
# Every vanilla iconic is listed explicitly, so automatic matching only applies to modded weapons.
# Generated from the game data (CDPR 2.5 tweak sources). Feel free to change the base weapons.
# ============================================================================

