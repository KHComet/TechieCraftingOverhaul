# ============================================================================
# Techie Crafting Overhaul - model (skin) map for perk 9
#
# Disassembling a normal weapon teaches the spec of "that weapon model". Model resolution order:
#   1. the disassembled preset itself if its record name contains _Default
#   2. the preset listed in this table (TCO.ModelMap.<preset record>)
#   3. a *_Default preset with the same display name
#   4. otherwise the disassembled preset as is
#
# Format: key = "TCO.ModelMap." + record ID of the disassembled preset
#         first entry of craftableItem = the preset registered as the spec (the crafted item)
# Modded weapons can be added the same way.
# ============================================================================

# Example: disassembling the NPC-only silenced Lexington teaches the normal Lexington spec
TCO.ModelMap.Items.Silenced_Lexington:
  $type: Craftable
  craftableItem: [ Items.Preset_Lexington_Default ]

# Example: the Arasaka Nue 2020 differs from the normal Nue in stats, so it keeps its own model
# (without an entry it would be its own model by rule 4 anyway; the line below is only an explicit declaration)
TCO.ModelMap.Items.Preset_Nue_Arasaka_2020:
  $type: Craftable
  craftableItem: [ Items.Preset_Nue_Arasaka_2020 ]
