# ============================================================================
# Techie Crafting Overhaul - configuration (TweakXL YAML)
# These values are read at game start; the scripts do not hardcode them.
# After changing a value, restart the game or run TweakXL.Reload() in the CET console.
# ============================================================================

# --- Perk mode -----------------------------------------------------------------
# auto      : real Tech tree nodes (must be bought) when Perk Addition Framework is installed,
#             otherwise the attribute thresholds below
# tree      : always tree nodes (perks stay inactive without the framework)
# attribute : always attribute thresholds (no nodes are added to the tree)
TCO.Config.perkMode: n"auto"

# --- Perk activation / required Technical Ability (attribute mode, or the auto-mode fallback) ---
# In tree mode the vanilla tier records set the requirement (Adept 9 / Expert 15 / Master 20).
TCO.Config.perk9Enabled: true
TCO.Config.perk15Enabled: true
TCO.Config.perk20Enabled: true
TCO.Config.perk9Attribute: 9
TCO.Config.perk15Attribute: 15
TCO.Config.perk20Attribute: 20

# --- Perk 20 (Detail Rigging, iconic replication) ------------------------------
# Item component consumed by replication (Tier 5 = Legendary) and amount
TCO.Config.replicaMaterialItem: t"Items.LegendaryMaterial1"
TCO.Config.replicaMaterialAmount: 200
# Minimum tier of the original and the base weapon (EffectiveTier stat: 8 = Tier 5, 9 = Tier 5+, 10 = Tier 5++)
TCO.Config.replicaRequiredTier: 8
# Allow disassembling replicas (vanilla 2.x blocks iconic disassembly; replicas are the only exception)
TCO.Config.replicaDisassembleAllowed: true
# Iconic weapons that get no replica (no spec is generated).
#   Skippy: voice lines, mode switching and the quest hand-in are quest scripting bound to the original item.
#   Erebus (Borg4a_HauntedGun and its quality variants): the Blackwall haunting raises quest facts on reload and kills.
#   Sniper_Nest_Version_Tech_Sniper_Rifle: quest-only stand-in for Rasetsu (the real one is handed over right after).
#   Add any weapon (modded ones too) you want excluded for the same reason, as t"Items.<record>".
TCO.Config.replicaExcluded:
  - t"Items.Preset_Yukimura_Skippy"
  - t"Items.Preset_Yukimura_Skippy_PostQuest"
  - t"Items.Preset_Borg4a_HauntedGun"
  - t"Items.Common_Borg4a_HauntedGun"
  - t"Items.Uncommon_Borg4a_HauntedGun"
  - t"Items.Rare_Borg4a_HauntedGun"
  - t"Items.Epic_Borg4a_HauntedGun"
  - t"Items.Legendary_Borg4a_HauntedGun"
  - t"Items.Sniper_Nest_Version_Tech_Sniper_Rifle"

# --- Perk 9 (If Johnny Were a Techie..., spec learning) -------------------------
# Tier range learned from a disassembled weapon
#   equal : only the tier of the disassembled weapon (default: a Tier 2 weapon gives a Tier 2 spec)
#   upto  : that tier and everything below
#   all   : Tier 1 to Tier 5++
TCO.Config.recipeTierMode: n"equal"
# Crafting costs are not configured here; they are read from vanilla records:
#   Tier 1-5 (plus variants included) = vanilla spec cost of the same quality (Items.Small_<Quality>_Crafting_Materials_Weapon, 30 components)
#   Tier 5+  = Tier 5 cost + Upgrading.Legendary     (iconic 5 -> 5+ upgrade, 75 Tier 5 components)
#   Tier 5++ = Tier 5+ cost + Upgrading.LegendaryPlus (iconic 5+ -> 5++ upgrade, 200 Tier 5 components)

# --- Misc ----------------------------------------------------------------------
TCO.Config.notifications: true
TCO.Config.debugLog: false
