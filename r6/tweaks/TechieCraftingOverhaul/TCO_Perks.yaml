# ============================================================================
# Techie Crafting Overhaul - three Tech tree perk nodes (requires Perk Addition Framework)
#
# 2.x perks are identified by the gamedataNewPerkType enum, so vanilla alone cannot add new nodes.
# Perk Addition Framework (JonnesTT) extends the enum through Codeware reflection and turns
# "NewPerks.<enumName>" records into real perks.
#
# The perk screen holds every slot widget and only enables the ones an attribute uses, so we borrow slots the Tech tree leaves empty.
# Connection lines are only drawn for slot pairs predefined in the layout, so we picked pairs other attribute trees use and Tech leaves free:
#   Right_Milestone_2 -> Right_Perk_2_1 (Body/Cool/Int/Ref), Right_Perk_2_1 -> Right_Perk_2_3 (Reflexes)
#   9  -> Right_Milestone_2 (row 2 right, milestone widget)
#   15 -> Right_Perk_2_1   (row 2 right, regular widget)
#   20 -> Right_Perk_2_3   (row 2 right, regular widget)
# The three nodes form a chain on the right of row 2. Perks 15/20 sit in the row-2 area but lock and unlock at 15/20 per their tier records;
# the descriptions state the requirement.
# Categories match the widget kind (milestone / regular / regular). A milestone or master category in a small widget
# mismatches the hover animation name and the icon disappears.
# The vanilla tier records set the requirement: Adept = 9, Expert = 15, Master = 20.
#
# TCO_Tweaks.reds attaches these records to NewPerks.TechnicalAbilityAttributeData.perks
# only when Perk Addition Framework is detected (see TCO.Config.perkMode).
# Name/description LocKeys are defined in TCO_Localization.reds (Codeware).
# ============================================================================

NewPerks.TCO_Tech_Johnny:
  $type: NewPerk
  enumName: TCO_Tech_Johnny
  enumComment: "TCO 9: If Johnny Were a Techie... - disassembling a non-iconic weapon teaches its crafting spec at every tier"
  loc_name_key: LocKey#TCO-Perk9-Name
  loc_desc_key: LocKey#TCO-Perk9-Desc
  perkIcon: UIIcon.Crafting_Area_02_Perk_2
  category: NewPerks.MilestoneNewPerkCategory
  slot: NewPerks.Right_Milestone_2
  requiresPerks: []
  tier: NewPerks.AdeptNewPerkTier
  attribute: NewPerks.TechnicalAbilityAttributeData
  levels:
    - loc_desc_key: LocKey#TCO-Perk9-Desc

NewPerks.TCO_Tech_Removable:
  $type: NewPerk
  enumName: TCO_Tech_Removable
  enumComment: "TCO 15: Should've Been Removable - weapon mods can be removed and swapped without loss, and are returned on disassembly"
  loc_name_key: LocKey#TCO-Perk15-Name
  loc_desc_key: LocKey#TCO-Perk15-Desc
  perkIcon: UIIcon.CraftingTrait01
  category: NewPerks.SimpleNewPerkCategory
  slot: NewPerks.Right_Perk_2_1
  requiresPerks: [ NewPerks.TCO_Tech_Johnny ]
  tier: NewPerks.ExpertNewPerkTier
  attribute: NewPerks.TechnicalAbilityAttributeData
  levels:
    - loc_desc_key: LocKey#TCO-Perk15-Desc

NewPerks.TCO_Tech_Rigging:
  $type: NewPerk
  enumName: TCO_Tech_Rigging
  enumComment: "TCO 20: Detail Rigging - clone a Tier 5+ iconic weapon once per weapon type"
  loc_name_key: LocKey#TCO-Perk20-Name
  loc_desc_key: LocKey#TCO-Perk20-Desc
  perkIcon: UIIcon.Crafting_Area_04_Perk_1
  category: NewPerks.SimpleNewPerkCategory
  slot: NewPerks.Right_Perk_2_3
  requiresPerks: [ NewPerks.TCO_Tech_Removable ]
  tier: NewPerks.MasterNewPerkTier
  attribute: NewPerks.TechnicalAbilityAttributeData
  levels:
    - loc_desc_key: LocKey#TCO-Perk20-Desc
