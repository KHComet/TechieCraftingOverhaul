# ============================================================================
# Techie Crafting Overhaul - perk icons (optional)
#
# A perk icon is the UIIcon record referenced by NewPerk.perkIcon.
# A UIIcon record has only two values: atlasResourcePath (.inkatlas path) + atlasPartName (part name inside the atlas).
# All vanilla 2.0 perk icons live in base\gameplay\gui\common\icons\perks\perks_icons.inkatlas,
# as white silhouettes on a transparent background; the game tints them by UI state (locked / available / bought).
#
# The defaults (TCO_Perks.yaml) reuse vanilla icons. To use custom icons:
#   1. Build PNG -> .xbm + .inkatlas with WolvenKit, pack it as an .archive and put it in archive/pc/mod/
#   2. Uncomment the UIIcon records below and set the path / part names
#   3. Uncomment the perkIcon override lines
# ============================================================================

# --- Custom icon records (uncomment to use) ----------------------------------------
#UIIcon.TCO_Perk9:
#  $type: UIIcon
#  atlasResourcePath: mod\tco\tco_perk_icons.inkatlas
#  atlasPartName: tco_perk9
#
#UIIcon.TCO_Perk15:
#  $type: UIIcon
#  atlasResourcePath: mod\tco\tco_perk_icons.inkatlas
#  atlasPartName: tco_perk15
#
#UIIcon.TCO_Perk20:
#  $type: UIIcon
#  atlasResourcePath: mod\tco\tco_perk_icons.inkatlas
#  atlasPartName: tco_perk20

# --- Attach icons to the perks (uncomment to use) ----------------------------------
#NewPerks.TCO_Tech_Johnny.perkIcon: UIIcon.TCO_Perk9
#NewPerks.TCO_Tech_Removable.perkIcon: UIIcon.TCO_Perk15
#NewPerks.TCO_Tech_Rigging.perkIcon: UIIcon.TCO_Perk20

# --- Switching to a different vanilla icon (example) -------------------------------
# Vanilla record names are in the CDPR tweak sources ui/icons/perks/*.tweak and ui/icons/new_perks/*.tweak.
#   UIIcon.Crafting_Area_01_Perk_1 ~ Crafting_Area_10_Perk_x   (1.x Crafting skill icons)
#   UIIcon.Engineering_Area_02_Perk_1 ...                       (1.x Engineering skill icons)
#   UIIcon.Tech_Central_Milestone_3, UIIcon.Tech_Right_Milestone_1, UIIcon.Tech_Master_Perk_3  (2.0 Tech icons)
#NewPerks.TCO_Tech_Removable.perkIcon: UIIcon.Crafting_Area_04_Perk_2
