# --- 바닐라 아이콘으로 바꾸고 싶을 때 (예시) ------------------------------------------
# 바닐라 레코드 이름은 CDPR tweak 소스 ui/icons/perks/*.tweak, ui/icons/new_perks/*.tweak 에 있습니다.
#   UIIcon.Crafting_Area_01_Perk_1 ~ Crafting_Area_10_Perk_x   (1.x 제작 스킬 아이콘)
#   UIIcon.Engineering_Area_02_Perk_1 ...                       (1.x 공학 스킬 아이콘)
#   UIIcon.Tech_Central_Milestone_3, UIIcon.Tech_Right_Milestone_1, UIIcon.Tech_Master_Perk_3  (2.0 테크 아이콘)
#NewPerks.TCO_Tech_Removable.perkIcon: UIIcon.Crafting_Area_04_Perk_2
